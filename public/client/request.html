<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>Barber-Select | Solicitar horário</title>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
          <header class="topbar">
            <h1 id="topbar-title">Solicitar horário</h1>
            <div class="muted" id="topbar-role"></div>
          </header>
          <main class="content">
            <div class="page-head">
              <div>
                <div class="eyebrow">Agendamento</div>
                <h2>Solicitar horário</h2>
                <p class="muted">Seu pedido vai para a fila interna.</p>
              </div>
            </div>
            <div class="card">
              <form class="form" id="request-form">
                <div class="field">
                  <label>Serviço</label><input required />
                </div>
                <div class="field">
                  <label>Profissional</label><input required />
                </div>
                <div class="field">
                  <label>Data</label><input type="date" required />
                </div>
                <div class="field">
                  <label>Horário</label><input type="time" required />
                </div>
                <div class="field">
                  <label>Observações</label><textarea></textarea>
                </div>
                <button class="btn btn-primary" type="submit">
                  Enviar solicitação
                </button>
              </form>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="/js/shared.js" defer></script>
    <script src="/js/client-request.js" defer></script>
  </body>
</html>
