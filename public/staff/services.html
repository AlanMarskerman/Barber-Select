<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>Barber-Select | Serviços</title>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
          <header class="topbar">
            <h1 id="topbar-title">Serviços</h1>
            <div class="muted" id="topbar-role"></div>
          </header>
          <main class="content">
            <div class="page-head">
              <div>
                <div class="eyebrow">Catálogo</div>
                <h2>Serviços e profissionais</h2>
                <p class="muted">Gestão de ofertas e equipe.</p>
              </div>
            </div>
            <div class="grid">
              <div class="card">
                <h3>Serviços</h3>
                <div class="agenda-item">
                  <div></div>
                  <div>
                    <strong>Corte clássico</strong>
                    <div class="muted">45 min · R$ 45,00</div>
                  </div>
                  <div></div>
                </div>
              </div>
              <div class="card">
                <h3>Profissionais</h3>
                <div class="agenda-item">
                  <div>AC</div>
                  <div>
                    <strong>André Costa</strong>
                    <div class="muted">Barbeiro sênior</div>
                  </div>
                  <div></div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="/js/shared.js" defer></script>
    <script src="/js/staff-services.js" defer></script>
  </body>
</html>
