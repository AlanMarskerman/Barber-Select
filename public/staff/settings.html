<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles.css" />
    <title>Barber-Select | Configurações</title>
  </head>
  <body>
    <div class="app">
      <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
          <header class="topbar">
            <h1 id="topbar-title">Configurações</h1>
            <div class="muted" id="topbar-role"></div>
          </header>
          <main class="content">
            <div class="page-head">
              <div>
                <div class="eyebrow">Preferências</div>
                <h2>Configurações</h2>
                <p class="muted">Ajustes simples.</p>
              </div>
            </div>
            <div class="card">
              <p class="muted">
                Aqui você poderia trocar tema, idioma e outras preferências
                guardadas no backend.
              </p>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="/js/core/shared.js" defer></script>
    <script src="/js/staff/staff-app.js" defer></script>
  </body>
</html>
