<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Select - Barbeiros</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../styles-logout.css">
</head>
<body>

  <!-- Estrutura principal da aplicação -->
  <div class="app">

    <!-- Menu lateral -->
    <aside class="sidebar">

      <!-- Logo da Barber Select -->
      <div class="brand">
        <img src="../assets/LOGO.png" alt="Barber Select">
      </div>

      <!-- Links de navegação do menu -->
      <nav class="nav">
        <a href="dashboard.html">
          <i class="bx bx-grid-alt"></i>
          <span>Dashboard</span>
        </a>
        <a href="agenda.html">
          <i class="bx bx-calendar"></i>
          <span>Agenda</span>
        </a>
        <a href="clients.html">
          <i class="bx bx-user"></i>
          <span>Clientes</span>
        </a>
        <a class="active" href="barbeiros.html">
          <i class="bx bx-user-check"></i>
          <span>Barbeiros</span>
        </a>
        <a href="services.html">
          <i class="bx bx-cut"></i>
          <span>Serviços</span>
        </a>
        <a href="produtos.html">
          <i class="bx bx-briefcase"></i>
          <span>Produtos</span>
        </a>
        <a href="venda.html">
          <i class="bx bx-cart"></i>
          <span>Vendas</span>
        </a>
        <a href="finance.html">
          <i class="bx bx-wallet"></i>
          <span>Financeiro</span>
        </a>
        <a href="relatorios.html">
          <i class="bx bx-bar-chart-alt-2"></i>
          <span>Relatórios</span>
        </a>
        <a href="avaliacoes.html">
          <i class="bx bx-star"></i>
          <span>Avaliações</span>
        </a>
        <a href="configuracoes.html">
          <i class="bx bx-cog"></i>
          <span>Configurações</span>
        </a>
      </nav>

      <!-- Botão para sair do sistema -->
      <button class="logout" type="button">
        <i class="bx bx-log-out"></i>
        <span>Sair</span>
      </button>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main">

      <!-- Cabeçalho superior -->
      <header class="topbar">
        <div class="head-left">
          <button class="menu-button hamb" type="button" aria-label="Abrir ou fechar menu">
            <i class="bx bx-menu"></i>
          </button>
          <div class="title">
            <h1>Barbeiros</h1>
            <p>Gerencie sua equipe</p>
          </div>
        </div>
      </header>

      <section class="content">

        <section class="panel panel-pad" style="max-width: 800px; margin: auto;">
          <form id="barber-form">
            <h2>CADASTRAR BARBEIRO</h2>
            <div style="display: grid; gap: 16px; margin-top: 20px;">
              <input type="text" placeholder="Nome do barbeiro" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
              <input type="email" placeholder="E-mail" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
              <input type="text" placeholder="Telefone" required style="padding: 12px; border: 1px solid #ddd; border-radius: 8px;">
              <button type="submit" style="padding: 12px; border: 0; border-radius: 8px; background: #064b2b; color: white; cursor: pointer;">Cadastrar</button>
            </div>
          </form>
        </section>

      </section>
    </main>
  </div>

  <!-- JavaScript -->
  <script src="../js/core/shared.js"></script>
  <script src="../js/staff/staff-app.js"></script>
</body>
</html>
